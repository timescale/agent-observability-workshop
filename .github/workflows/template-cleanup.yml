# Runs once, on the first push to a repo created from this template, then
# deletes itself.
#
# GitHub template repos copy files verbatim — there's no variable substitution —
# so a Codespaces badge pointing at the template arrives in your new repo still
# pointing at the template. It renders fine, it's clickable, and it opens the
# wrong repo. This fixes that before anyone notices.
name: Template cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    # Never run on the template itself.
    if: github.repository != 'timescale/workshop-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point template references at this repo
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY##*/}"

          # Codespaces badge and any other owner/repo references.
          grep -rl 'timescale/workshop-template' --exclude-dir=.git . \
            | while read -r f; do
                sed -i "s|timescale/workshop-template|${GITHUB_REPOSITORY}|g" "$f"
              done

          # Devcontainer display name.
          sed -i "s|\"name\": \"workshop-template\"|\"name\": \"${repo_name}\"|" \
            .devcontainer/devcontainer.json

          # This workflow has done its one job.
          rm -f .github/workflows/template-cleanup.yml

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to rewrite."
          else
            git commit -m "Initialise from workshop-template" \
                       -m "Points template references at this repo and removes the one-shot cleanup workflow."
            git push
          fi
